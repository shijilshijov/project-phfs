<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#080b12">
<title>Ray-Ban Meta Safari Converter</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080b12;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;min-height:100vh;padding:18px}main{max-width:520px;margin:auto}.card{background:#121722;border:1px solid #263044;border-radius:22px;padding:22px;box-shadow:0 16px 50px #0008}h1{font-size:23px;margin:0 0 6px}.sub{color:#9aa7bb;line-height:1.45;margin:0 0 20px}.pick{display:block;border:2px dashed #3b82f6;border-radius:16px;padding:28px 16px;text-align:center;cursor:pointer}.pick input{display:none}.icon{font-size:34px}.muted{color:#9aa7bb;font-size:13px}video{display:none;width:100%;max-height:300px;margin-top:15px;border-radius:12px;background:#000}button{width:100%;border:0;border-radius:13px;padding:15px;margin-top:15px;background:#3b82f6;color:#fff;font-size:16px;font-weight:700}button:disabled{background:#3b4558;color:#aeb7c6}#save{display:none;background:#10b981}.bar{height:9px;background:#293244;border-radius:10px;overflow:hidden;margin-top:16px;display:none}.fill{height:100%;width:0;background:#3b82f6}.status{text-align:center;color:#9aa7bb;font-size:13px;margin-top:11px;min-height:18px}.warning{display:none;margin-top:15px;padding:12px;border:1px solid #f59e0b;border-radius:11px;color:#fbbf24;font-size:12px;line-height:1.45}.info{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}.info div{border:1px solid #263044;border-radius:11px;padding:10px;text-align:center;color:#9aa7bb;font-size:12px}.info b{display:block;color:#fff;font-size:13px;margin-bottom:3px}
</style>
</head>
<body><main><div class="card">
<h1>🕶️ Ray-Ban Meta Converter</h1><p class="sub">Safari-native converter. Creates a 1440 × 1920 portrait MP4 when Safari provides H.264 MP4 recording.</p>
<label class="pick"><div class="icon">🎬</div><div style="font-size:17px;font-weight:600;margin-top:7px">Tap to choose video</div><div class="muted" style="margin-top:5px">MP4 / MOV / WebM</div><input id="file" type="file" accept="video/mp4,video/quicktime,video/webm,.mp4,.mov,.webm"></label>
<div id="name" style="font-weight:600;margin-top:10px;word-break:break-word"></div><video id="preview" controls playsinline></video>
<button id="convert" disabled>Convert to 1440 × 1920 MP4</button><button id="save">Save / Share Converted MP4</button>
<div class="bar" id="bar"><div class="fill" id="fill"></div></div><div class="status" id="status">Choose a video to begin.</div><div class="warning" id="warning"></div>
<div class="info"><div><b>1440 × 1920</b>Output</div><div><b>H.264 MP4</b>Safari encoder</div><div><b>3:4</b>Center crop</div><div><b>Local</b>No upload</div></div>
</div></main>
<script>
const fileInput=document.getElementById('file'),preview=document.getElementById('preview'),convert=document.getElementById('convert'),save=document.getElementById('save'),bar=document.getElementById('bar'),fill=document.getElementById('fill'),status=document.getElementById('status'),warning=document.getElementById('warning');let file=null,outputBlob=null,outputURL=null;function setStatus(t){status.textContent=t}function supports(m){return window.MediaRecorder&&MediaRecorder.isTypeSupported(m)}function showWarning(t){warning.textContent=t;warning.style.display='block'}
fileInput.addEventListener('change',()=>{file=fileInput.files&&fileInput.files[0];if(!file)return;preview.src=URL.createObjectURL(file);preview.style.display='block';document.getElementById('name').textContent=file.name;convert.disabled=false;save.style.display='none';warning.style.display='none';setStatus('Video ready.')});
convert.addEventListener('click',async()=>{if(!file)return;convert.disabled=true;save.style.display='none';bar.style.display='block';fill.style.width='0%';setStatus('Preparing Safari encoder…');const W=1440,H=1920,FPS=30,v=document.createElement('video');v.src=URL.createObjectURL(file);v.playsInline=true;v.muted=false;v.preload='auto';try{await new Promise((resolve,reject)=>{if(v.readyState>=1)resolve();else{v.onloadedmetadata=resolve;v.onerror=()=>reject(new Error('Safari could not read this video.'))}});const canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;const ctx=canvas.getContext('2d',{alpha:false});const canvasStream=canvas.captureStream(FPS);let audioContext=null,audioDestination=null;try{audioContext=new(window.AudioContext||window.webkitAudioContext)();const source=audioContext.createMediaElementSource(v);audioDestination=audioContext.createMediaStreamDestination();source.connect(audioDestination)}catch(e){console.warn('Audio capture unavailable',e)}const tracks=[...canvasStream.getVideoTracks()];if(audioDestination)tracks.push(...audioDestination.stream.getAudioTracks());const stream=new MediaStream(tracks);const mimeCandidates=['video/mp4;codecs="avc1.4D401F,mp4a.40.2"','video/mp4;codecs="avc1.4D401F"','video/mp4'];let mime=mimeCandidates.find(supports);if(!mime){const webm=['video/webm;codecs="vp8,opus"','video/webm'].find(supports);if(webm){showWarning('This Safari cannot create MP4 directly. WebM will be created instead. Update iOS/Safari if MP4 is required.');mime=webm}else throw new Error('This Safari does not support a usable MediaRecorder format.')}const chunks=[];const recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:12000000,audioBitsPerSecond:192000});recorder.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};const stopped=new Promise(resolve=>recorder.addEventListener('stop',resolve,{once:true}));v.currentTime=0;await v.play();if(audioContext&&audioContext.state==='suspended')await audioContext.resume();recorder.start(250);function draw(){if(v.ended||v.paused){if(recorder.state==='recording')recorder.stop();return}const scale=Math.max(W/v.videoWidth,H/v.videoHeight),rw=v.videoWidth*scale,rh=v.videoHeight*scale,x=(W-rw)/2,y=(H-rh)/2;ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);ctx.drawImage(v,x,y,rw,rh);const p=Math.min(100,(v.currentTime/v.duration)*100);fill.style.width=p+'%';setStatus('Converting… '+Math.round(p)+'%');requestAnimationFrame(draw)}draw();await stopped;tracks.forEach(t=>t.stop());canvasStream.getTracks().forEach(t=>t.stop());if(audioContext)try{await audioContext.close()}catch{}const isMP4=mime.includes('mp4');outputBlob=new Blob(chunks,{type:mime});outputURL=URL.createObjectURL(outputBlob);const ext=isMP4?'mp4':'webm',outName='RayBan_Meta_1440x1920.'+ext;save.style.display='block';fill.style.width='100%';setStatus('Done — tap “Save / Share Converted”');save.onclick=async()=>{const outFile=new File([outputBlob],outName,{type:mime});if(navigator.share){try{if(!navigator.canShare||navigator.canShare({files:[outFile]})){await navigator.share({files:[outFile],title:'Ray-Ban Meta Video'});return}}catch(e){if(e.name==='AbortError')return}}const a=document.createElement('a');a.href=outputURL;a.download=outName;document.body.appendChild(a);a.click();a.remove()}}catch(err){console.error(err);setStatus('Conversion failed.');showWarning(err.message||String(err))}finally{convert.disabled=false}});
</script></body></html>
